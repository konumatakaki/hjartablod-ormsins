name: check-content
on:
  push:
    paths: ["content/**", "tools/**", "package.json", ".github/workflows/check-content.yml"]
  pull_request:
    paths: ["content/**", "tools/**", "package.json"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:content
